[project]
name = "steward-crew"
version = "0.1.0"
description = "An AI crew on Switch that looks after an open-source project's contributors. AI proposes, the Ledger acts, a maintainer decides."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "websockets>=12",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
steward = "steward.cli:main"
steward-ledger = "steward.ledger:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
